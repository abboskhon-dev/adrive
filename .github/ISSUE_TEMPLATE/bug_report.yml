name: 🐛 Bug report
description: Report a reproducible bug or regression in adrive.
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      options:
        - label: I tested on the latest `main` and rebuilt the helper with `./build.sh`.
          required: true
        - label: I checked for possible duplicate issues.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What happened, and what you expected. Include the exact error text.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact `adrive` command that failed.
      placeholder: "adrive tap 'Play' --windows"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device or emulator, Android version, app build type, host OS, Node version.
      placeholder: "Pixel 8, Android 15, release build, macOS 15, Node 22"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant `adrive ui --json` or command output. Remove personal data first.
      render: shell
    validations:
      required: false
