name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm test
      - uses: ./.github/actions/helper
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: helper/build/classes.dex
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\nHelper dex sha256: `%s`\n' "$(sha256sum helper/build/classes.dex | cut -d' ' -f1)" >> notes.md
          gh release create "$GITHUB_REF_NAME" helper/build/classes.dex --title "$GITHUB_REF_NAME" --notes-file notes.md
