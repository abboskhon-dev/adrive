name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  helper:
    name: helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helper
      - uses: actions/upload-artifact@v4
        with:
          name: helper-dex-${{ matrix.os }}
          path: helper/build/classes.dex

  reproducible:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: helper-dex-*
      - run: sha256sum helper-dex-*/classes.dex && cmp helper-dex-ubuntu-latest/classes.dex helper-dex-macos-latest/classes.dex

  fixtures:
    name: fixture (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [fixture, compose, flutter, react-native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - if: matrix.fixture == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
      - if: matrix.fixture == 'react-native'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p ~/.android && [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname CN=debug -keyalg RSA -validity 10000
        if: matrix.fixture == 'fixture'
      - run: ./bench/${{ matrix.fixture }}/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ matrix.fixture }}
          path: bench/${{ matrix.fixture }}/build/fixture.apk

  emulator:
    name: emulator (API ${{ matrix.api }})
    needs: [helper, fixtures]
    if: ${{ !cancelled() && needs.helper.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 33, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: helper-dex-ubuntu-latest
          path: helper/build
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fixture-*
      - run: for d in fixture-*; do [ -d "$d" ] || continue; mkdir -p bench/${d#fixture-}/build && mv $d/fixture.apk bench/${d#fixture-}/build/; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./test/smoke.sh && ./test/fixtures.sh
